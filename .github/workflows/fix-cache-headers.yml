name: Fix Nginx Cache Headers

on:
  push:
    branches: [main]
    paths:
      - "scripts/nginx-fix.sh"
      - ".github/workflows/fix-cache-headers.yml"
  workflow_dispatch:

jobs:
  fix-cache:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Run nginx fix on VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PASS: ${{ secrets.VPS_PASS }}
        run: |
          retry() {
            i=1
            until "$@"; do
              [ $i -ge 3 ] && return 1
              echo "retry $i..."; sleep 5; i=$((i+1))
            done
          }
          retry sshpass -p "$VPS_PASS" scp \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=30 \
            scripts/nginx-fix.sh "${VPS_USER}@${VPS_HOST}:/tmp/nginx-fix.sh"
          retry sshpass -p "$VPS_PASS" ssh \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=30 \
            "${VPS_USER}@${VPS_HOST}" 'bash /tmp/nginx-fix.sh'

      - name: Verify headers live
        run: |
          sleep 3
          IDX=$(curl -sD - -o /dev/null "https://alurkasku.com/?cb=$RANDOM$RANDOM" | grep -ci "^cache-control" || true)
          echo "cache-control headers on / : $IDX"
          [ "$IDX" -ge 1 ] || { echo "FAIL: index.html still has no Cache-Control"; exit 1; }
