name: Fix Nginx Cache Headers

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  fix-cache:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Patch nginx on VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PASS: ${{ secrets.VPS_PASS }}
        run: |
          retry() {
            i=1
            until "$@"; do
              [ $i -ge 3 ] && return 1
              echo "retry $i..."; sleep 5; i=$((i+1))
            done
          }
          retry sshpass -p "$VPS_PASS" scp \
            -o StrictHostKeyChecking=no \
            scripts/nginx-fix.sh "${VPS_USER}@${VPS_HOST}:/tmp/nginx-fix.sh"
          retry sshpass -p "$VPS_PASS" ssh \
            -o StrictHostKeyChecking=no \
            "${VPS_USER}@${VPS_HOST}" 'bash /tmp/nginx-fix.sh'

      - name: Clean up stale diag file
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PASS: ${{ secrets.VPS_PASS }}
        run: |
          sshpass -p "$VPS_PASS" ssh \
            -o StrictHostKeyChecking=no \
            "${VPS_USER}@${VPS_HOST}" \
            'rm -f /var/www/cashvio/dist/nginx-diag.txt' || true
