name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VITE_API_URL: http://195.35.45.234
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Deploy dist to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PASS: ${{ secrets.VPS_PASS }}
        run: |
          retry() {
            i=1
            until "$@"; do
              [ $i -ge 3 ] && return 1
              echo "retry $i..."; sleep 5; i=$((i+1))
            done
          }
          tar czf - -C dist . | retry sshpass -p "$VPS_PASS" ssh \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=30 \
            -o ConnectionAttempts=3 \
            "${VPS_USER}@${VPS_HOST}" "rm -rf /var/www/cashvio/dist/* && tar xzf - -C /var/www/cashvio/dist"